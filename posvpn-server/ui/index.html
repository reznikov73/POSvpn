<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>POSvpn Server</title>
<style>
  :root {
    --bg: #10141b;
    --panel: #1a202a;
    --line: #2b3546;
    --text: #e7eef7;
    --muted: #8b98ab;
    --accent: #35b4e8;
    --green: #43c07b;
    --yellow: #e0b341;
    --red: #e35d5d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.35 "Segoe UI", Tahoma, sans-serif;
    user-select: none;
    overflow: hidden;
  }
  .app { height: 100vh; display: flex; flex-direction: column; }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px 10px;
  }
  .logo { width: 26px; height: 30px; flex: none; }
  .brand { font-size: 15px; letter-spacing: 2.4px; font-weight: 600; }
  .brand span { color: var(--accent); }
  .tag {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  main { flex: 1; overflow-y: auto; padding: 12px 16px; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #2f3a4b; border-radius: 8px; }

  .banner {
    display: none;
    margin-bottom: 12px;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 12px;
    background: rgba(224,179,65,.12);
    border: 1px solid rgba(224,179,65,.35);
    color: #ffe2a3;
  }

  .card {
    padding: 14px;
    border-radius: 12px;
    background: linear-gradient(180deg, #202937, #1a222d);
    border: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .status { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .power {
    width: 68px; height: 68px; flex: none; border-radius: 50%;
    border: 2px solid #3b475a;
    background: radial-gradient(circle at 50% 35%, #2a3342, #1a222d 70%);
    color: #6c7c90; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; cursor: pointer;
    transition: .15s;
  }
  .power:hover { border-color: #4a5a72; }
  .power.on {
    border-color: var(--green); color: #d9ffe9;
    background: radial-gradient(circle at 50% 35%, #2c6b47, #173222 72%);
    box-shadow: 0 0 20px rgba(67,192,123,.35), inset 0 0 16px rgba(67,192,123,.2);
  }
  .power .glyph { width: 24px; height: 24px; display: block; }
  .power .word { font-size: 10px; letter-spacing: 2px; }
  .status .info { min-width: 0; }
  .status .title { font-size: 17px; font-weight: 600; }
  .status .uptime { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .kv { display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; font-size: 12.5px; }
  .kv .k { color: var(--muted); }
  .kv .v { color: #cdd9e8; word-break: break-all; }
  .mono { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 10px;
  }
  .stat .num { font-size: 18px; font-weight: 600; }
  .stat .cap { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .net {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .net-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: linear-gradient(180deg, #2a3a4f, #22303f);
  }
  .net-head .name { font-weight: 600; }
  .net-head .subnet { color: #a9bdd2; font-size: 11.5px; font-family: Consolas, monospace; }
  .net-head .count { margin-left: auto; font-size: 12px; color: #a9bdd2; }
  .net .closed { font-size: 10px; color: var(--yellow); margin-left: 8px; }

  .node {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    font-size: 13px;
  }
  .node + .node { border-top: 1px solid rgba(43,53,70,.55); }
  .node .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .ip { font-family: Consolas, monospace; font-size: 12px; color: #a9bdd2; }
  .node .idx { width: 28px; text-align: right; color: var(--muted); font-size: 11px; }
  .node.off .nm, .node.off .ip { color: #5f6d80; }
  .node .role { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .dot-sm { width: 7px; height: 7px; border-radius: 50%; background: #3a4658; flex: none; }
  .dot-sm.on { background: var(--green); }

  .empty { padding: 18px 12px; text-align: center; color: var(--muted); font-size: 12px; }

  footer {
    border-top: 1px solid var(--line);
    padding: 9px 16px 12px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  footer .paths { flex: 1; min-width: 0; overflow: hidden; }
  footer .paths div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.btn {
    padding: 7px 12px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #263140;
    color: var(--text);
    font: 12px "Segoe UI", sans-serif;
    cursor: pointer;
  }
  button.btn:hover { background: #2d3a4c; }
  button.btn.warn { border-color: rgba(227,93,93,.5); color: #ffb3b3; }
  #error { color: #ff9d9d; display: none; margin-top: 8px; font-size: 12px; }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(6,9,13,.66);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal.show { display: flex; }
  .sheet {
    width: 100%;
    max-width: 360px;
    background: #1d2531;
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
    padding: 16px;
  }
  .sheet h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .6px;
  }
  .field input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #151b24;
    color: var(--text);
    font: 13px Consolas, monospace;
    outline: none;
    user-select: text;
  }
  .field input:focus { border-color: var(--accent); }
  .hint { margin: 8px 0 0; font-size: 11px; line-height: 1.45; color: var(--muted); }
  .form-error { display: none; margin-top: 8px; color: #ff9d9d; font-size: 12px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .row .btn { flex: 1; padding: 9px 12px; font-size: 13px; }
  .row .btn.primary { background: linear-gradient(180deg, #38a9d6, #2a83ab); border-color: #3fb4e4; color: #f2fbff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="logo" viewBox="0 0 28 32" aria-hidden="true">
      <path d="M14 1 26 5v10c0 7.6-5 12.9-12 16C7 27.9 2 22.6 2 15V5L14 1z"
            fill="#1f7fae" stroke="#35b4e8" stroke-width="1.4"/>
      <path d="M14 6 22 8.8v6.4c0 5-3.2 8.7-8 11-4.8-2.3-8-6-8-11V8.8L14 6z"
            fill="#12303f"/>
      <text x="14" y="20" text-anchor="middle" font-size="10" font-weight="700"
            fill="#7fd8ff" font-family="Segoe UI, sans-serif">S</text>
    </svg>
    <div class="brand">POS<span>VPN</span></div>
    <div class="tag">сервер</div>
  </header>

  <main>
    <div class="banner" id="banner"></div>

    <section class="card">
      <div class="status">
        <div class="power on" id="power">
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.2v8.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M6.4 6.6a8 8 0 1 0 11.2 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <div class="word" id="powerWord">ON</div>
        </div>
        <div class="info">
          <div class="title" id="stateTitle">Работает</div>
          <div class="uptime" id="uptime"></div>
        </div>
      </div>
      <div class="kv">
        <div class="k">Контроль</div><div class="v mono" id="listen">—</div>
        <div class="k">Хаб</div><div class="v mono" id="hub">—</div>
        <div class="k">Отпечаток</div><div class="v mono" id="fingerprint">—</div>
        <div class="k">Узлов</div><div class="v" id="nodes">0</div>
      </div>
    </section>

    <section class="stats">
      <div class="stat" title="Кадры, пришедшие от клиентов"><div class="num" id="received">0</div><div class="cap">принято</div></div>
      <div class="stat" title="Кадры, доставленные адресату"><div class="num" id="forwarded">0</div><div class="cap">переслано</div></div>
      <div class="stat" title="Кадры dst=0, разосланные всей сети"><div class="num" id="broadcast">0</div><div class="cap">бродкаст</div></div>
      <div class="stat" title="Не удалось доставить: неизвестный индекс, кадр больше лимита, битый заголовок"><div class="num" id="dropped">0</div><div class="cap">отброшено</div></div>
    </section>

    <div id="networks"></div>
    <div id="error"></div>
  </main>

  <footer>
    <div class="paths">
      <div id="storePath" title="">состояние: —</div>
      <div id="logPath" title="">журнал: —</div>
    </div>
    <button class="btn" id="settingsBtn" type="button">Настройки</button>
    <button class="btn" id="openLogs" type="button">Журнал</button>
    <button class="btn warn" id="quit" type="button">Выход</button>
  </footer>
</div>

<div class="modal" id="settingsModal">
  <div class="sheet">
    <h2>Настройки сервера</h2>
    <div class="field">
      <label for="sListen">Контроль: адрес и порт</label>
      <input id="sListen" placeholder="0.0.0.0:8787" autocomplete="off">
    </div>
    <div class="field">
      <label for="sHub">Хаб: адрес и порт</label>
      <input id="sHub" placeholder="0.0.0.0:8788" autocomplete="off">
    </div>
    <p class="hint">Изменения применяются сразу: сервер остановится и поднимется с новыми адресами. Пустой адрес хаба отключает хаб.</p>
    <div class="form-error" id="settingsError"></div>
    <div class="row">
      <button class="btn" id="settingsCancel" type="button">Отмена</button>
      <button class="btn primary" id="settingsSave" type="button">Сохранить</button>
    </div>
  </div>
</div>

<script>
  var STATE = null;
  var ACT_ERROR = false;

  function $(id) { return document.getElementById(id); }
  function setText(id, value) { var el = $(id); if (el && el.textContent !== value) el.textContent = value; }
  function esc(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  async function refresh() {
    try {
      var state = JSON.parse(await window.serverState());
      STATE = state;
      render(state);
    } catch (e) {
      var err = $('error');
      err.textContent = 'Окно инициализируется…';
      err.style.display = 'block';
    }
  }

  async function act(name, payload) {
    try {
      var res = JSON.parse(await window.serverAction(name, JSON.stringify(payload || {})));
      ACT_ERROR = !res.ok;
      if (!res.ok) {
        var err = $('error');
        err.textContent = res.error || 'Ошибка';
        err.style.display = 'block';
      }
    } catch (e) {}
  }

  function render(s) {
    var running = !!s.running;
    var power = $('power');
    power.classList.toggle('on', running);
    setText('powerWord', running ? 'ON' : 'OFF');
    setText('stateTitle', running ? 'Работает' : 'Остановлен');
    setText('uptime', running && s.uptime ? 'работает ' + s.uptime : 'нажмите кнопку, чтобы запустить');

    var banner = $('banner');
    if (s.local_only) {
      banner.textContent = 'Сервер слушает только этот компьютер (' + (s.listen || '') + '). Удалённые клиенты не подключатся — запустите с -listen 0.0.0.0:8787.';
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
    }

    var errBox = $('error');
    if (s.error) {
      errBox.textContent = s.error;
      errBox.style.display = 'block';
    } else if (!ACT_ERROR) {
      errBox.style.display = 'none';
      errBox.textContent = '';
    }
    setText('listen', s.listen || '—');
    setText('hub', s.hub || 'выключен');
    setText('fingerprint', s.fingerprint || '—');
    setText('nodes', String(s.nodes || 0));

    setText('received', String(s.received || 0));
    setText('forwarded', String(s.forwarded || 0));
    setText('broadcast', String(s.broadcast || 0));
    setText('dropped', String(s.dropped || 0));

    var storePath = $('storePath');
    storePath.textContent = 'состояние: ' + (s.store || '—');
    storePath.title = s.store || '';
    var logPath = $('logPath');
    logPath.textContent = 'журнал: ' + (s.log || '—');
    logPath.title = s.log || '';

    var box = $('networks');
    var networks = s.networks || [];
    if (!networks.length) {
      box.innerHTML = '<div class="empty">Сетей пока нет. Создайте сеть из клиента.</div>';
      return;
    }

    var html = '';
    networks.forEach(function (net) {
      html += '<div class="net"><div class="net-head">' +
        '<span class="name">' + esc(net.name) + '</span>' +
        '<span class="subnet">' + esc(net.subnet || '') + '</span>' +
        (net.closed ? '<span class="closed">закрыта</span>' : '') +
        '<span class="count">' + (net.nodes || []).length + ' узл.</span>' +
        '</div>';
      (net.nodes || []).forEach(function (node) {
        html += '<div class="node ' + (node.online ? '' : 'off') + '">' +
          '<span class="dot-sm ' + (node.online ? 'on' : '') + '"></span>' +
          '<span class="nm">' + esc(node.name) + '</span>' +
          '<span class="role">' + esc(node.role || '') + '</span>' +
          '<span class="ip">' + esc(node.ip) + '</span>' +
          '<span class="idx">' + (node.index || '') + '</span>' +
          '</div>';
      });
      html += '</div>';
    });
    box.innerHTML = html;
  }

  $('openLogs').addEventListener('click', function () { act('open_logs'); });

  $('settingsBtn').addEventListener('click', function () {
    $('sListen').value = (STATE && STATE.listen) || '0.0.0.0:8787';
    $('sHub').value = (STATE && STATE.hub) || '0.0.0.0:8788';
    $('settingsError').style.display = 'none';
    $('settingsModal').classList.add('show');
  });

  $('settingsCancel').addEventListener('click', function () {
    $('settingsModal').classList.remove('show');
  });

  $('settingsSave').addEventListener('click', async function () {
    var listen = $('sListen').value.trim();
    var hub = $('sHub').value.trim();
    var err = $('settingsError');
    if (!listen) {
      err.textContent = 'Адрес контроля не может быть пустым';
      err.style.display = 'block';
      return;
    }
    var res = await act('settings', { listen: listen, hub: hub });
    if (res.ok) {
      $('settingsModal').classList.remove('show');
    } else {
      err.textContent = res.error || 'Не удалось применить настройки';
      err.style.display = 'block';
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') $('settingsModal').classList.remove('show');
  });
  $('power').addEventListener('click', function () {
    if (!STATE) return;
    if (STATE.running) {
      if (confirm('Остановить сервер? Клиенты потеряют связь с хабом.')) act('stop');
    } else {
      act('start');
    }
  });
  $('quit').addEventListener('click', function () {
    if (confirm('Остановить сервер? Все клиенты потеряют связь с хабом.')) act('quit');
  });

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
