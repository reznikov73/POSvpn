<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="400" fill="#0f1a26"/>
  <text x="24" y="34" fill="#e6eef8" font-size="18" font-weight="600">«Весь трафик через VPN»: телефон выходит в интернет через другой ПК</text>

  <!-- phone -->
  <rect x="30" y="70" width="170" height="110" rx="12" fill="#16283a" stroke="#2b4761"/>
  <text x="48" y="98" fill="#7fd8ff" font-size="14" font-weight="600">телефон</text>
  <text x="48" y="120" fill="#9fb0c6" font-size="12">10.77.1.3</text>
  <text x="48" y="142" fill="#c6d3e3" font-size="11">маршрут 0.0.0.0/1</text>
  <text x="48" y="160" fill="#c6d3e3" font-size="11">шлюз: 10.77.1.2</text>

  <!-- hub -->
  <rect x="250" y="70" width="170" height="110" rx="12" fill="#16283a" stroke="#2b4761"/>
  <text x="268" y="98" fill="#7fd8ff" font-size="14" font-weight="600">хаб</text>
  <text x="268" y="120" fill="#9fb0c6" font-size="12">rez-Home</text>
  <text x="268" y="142" fill="#c6d3e3" font-size="11">пересылает кадры</text>
  <text x="268" y="160" fill="#c6d3e3" font-size="11">по номеру узла</text>

  <!-- gateway -->
  <rect x="470" y="70" width="200" height="110" rx="12" fill="#16283a" stroke="#2e7d4f"/>
  <text x="488" y="98" fill="#8ee6a8" font-size="14" font-weight="600">шлюз</text>
  <text x="488" y="120" fill="#9fb0c6" font-size="12">10.77.1.2</text>
  <text x="488" y="142" fill="#c6d3e3" font-size="11">NAT: WinNAT / iptables</text>
  <text x="488" y="160" fill="#c6d3e3" font-size="11">подменяет адрес</text>

  <!-- internet -->
  <rect x="720" y="70" width="180" height="110" rx="12" fill="#16283a" stroke="#2b4761"/>
  <text x="738" y="98" fill="#7fd8ff" font-size="14" font-weight="600">интернет</text>
  <text x="738" y="120" fill="#9fb0c6" font-size="12">сайты видят</text>
  <text x="738" y="142" fill="#c6d3e3" font-size="11">адрес шлюза,</text>
  <text x="738" y="160" fill="#c6d3e3" font-size="11">а не телефона</text>

  <path d="M200 125 H250" stroke="#35b4e8" stroke-width="2"/>
  <path d="M420 125 H470" stroke="#35b4e8" stroke-width="2"/>
  <path d="M670 125 H720" stroke="#35b4e8" stroke-width="2"/>
  <path d="M720 205 H470" stroke="#6b8fb5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="520" y="228" fill="#9fb0c6" font-size="11">ответ возвращается по подсети 10.77.1.0/24</text>

  <text x="30" y="280" fill="#e6eef8" font-size="14" font-weight="600">Два разных механизма — не путать</text>
  <rect x="30" y="296" width="430" height="76" rx="10" fill="#132131" stroke="#22384d"/>
  <text x="46" y="320" fill="#7fd8ff" font-size="12" font-weight="600">SOCKS5-прокси (10.77.1.2:1080)</text>
  <text x="46" y="342" fill="#c6d3e3" font-size="11">приложение само обращается к прокси; только TCP;</text>
  <text x="46" y="360" fill="#c6d3e3" font-size="11">не требует прав администратора и NAT</text>

  <rect x="480" y="296" width="420" height="76" rx="10" fill="#132131" stroke="#22384d"/>
  <text x="496" y="320" fill="#8ee6a8" font-size="12" font-weight="600">NAT-шлюз (галочка в клиенте)</text>
  <text x="496" y="342" fill="#c6d3e3" font-size="11">весь IP-трафик устройства; WinNAT или iptables;</text>
  <text x="496" y="360" fill="#c6d3e3" font-size="11">на телефоне включается «весь трафик через VPN»</text>
</svg>
