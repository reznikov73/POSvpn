<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="360" fill="#0f1a26"/>
  <text x="24" y="36" fill="#e6eef8" font-size="18" font-weight="600">Одна сеть 10.77.1.0/24 — три узла в разных местах</text>

  <!-- rez-Home -->
  <rect x="40" y="70" width="230" height="120" rx="14" fill="#16283a" stroke="#2b4761"/>
  <text x="60" y="100" fill="#7fd8ff" font-size="15" font-weight="600">rez-Home</text>
  <text x="60" y="124" fill="#9fb0c6" font-size="12">10.77.1.1</text>
  <text x="60" y="146" fill="#c6d3e3" font-size="12">координатор :8787</text>
  <text x="60" y="166" fill="#c6d3e3" font-size="12">QUIC-хаб :8788</text>

  <!-- rez-homework -->
  <rect x="355" y="70" width="230" height="120" rx="14" fill="#16283a" stroke="#2b4761"/>
  <text x="375" y="100" fill="#7fd8ff" font-size="15" font-weight="600">rez-homework</text>
  <text x="375" y="124" fill="#9fb0c6" font-size="12">10.77.1.2</text>
  <text x="375" y="146" fill="#c6d3e3" font-size="12">клиент + NAT-шлюз</text>
  <text x="375" y="166" fill="#8ee6a8" font-size="12">выход в интернет</text>

  <!-- phone -->
  <rect x="670" y="70" width="230" height="120" rx="14" fill="#16283a" stroke="#2b4761"/>
  <text x="690" y="100" fill="#7fd8ff" font-size="15" font-weight="600">телефон</text>
  <text x="690" y="124" fill="#9fb0c6" font-size="12">10.77.1.3</text>
  <text x="690" y="146" fill="#c6d3e3" font-size="12">клиент Android</text>
  <text x="690" y="166" fill="#9fb0c6" font-size="12">мобильный интернет</text>

  <!-- hub lines -->
  <path d="M270 130 H355" stroke="#35b4e8" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M585 130 H670" stroke="#35b4e8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="272" y="120" fill="#7fd8ff" font-size="11">QUIC + ChaCha20</text>
  <text x="588" y="120" fill="#7fd8ff" font-size="11">QUIC + ChaCha20</text>

  <text x="40" y="240" fill="#9fb0c6" font-size="13">Хаб пересылает кадры по номеру узла и не читает содержимое: ключи есть только у отправителя и получателя.</text>
  <text x="40" y="266" fill="#9fb0c6" font-size="13">Адреса выдаёт координатор: у каждой сети своя подсеть /24 внутри 10.77.0.0/16.</text>

  <rect x="40" y="292" width="860" height="42" rx="10" fill="#132131" stroke="#22384d"/>
  <text x="58" y="318" fill="#c6d3e3" font-size="12">Порты открывать не нужно: все узлы сами подключаются к хабу, NAT и белый IP на клиентах не требуются.</text>
</svg>
